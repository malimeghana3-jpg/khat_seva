<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Farmer Registration - Khat Seva</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container" style="max-width: 460px; margin: 40px auto; padding: 20px;">
        <h2>Farmer Registration</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="{{ category }}">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/register">
            <p>
                <label>Full Name</label><br>
                <input type="text" name="name" required style="width: 100%;">
            </p>
            <p>
                <label>Mobile (10 digits)</label><br>
                <input type="text" name="mobile" maxlength="10" required style="width: 100%;">
            </p>
            <p>
                <label>Email</label><br>
                <input type="email" name="email" required style="width: 100%;">
            </p>
            <p>
                <label>Address</label><br>
                <input type="text" name="address" required style="width: 100%;">
            </p>
            <p>
                <label>Village</label><br>
                <input type="text" name="village" required style="width: 100%;">
            </p>
            <p>
                <label>District</label><br>
                <input type="text" name="district" required style="width: 100%;">
            </p>
            <p>
                <label>Land Details</label><br>
                <input type="text" name="land_details" required style="width: 100%;">
            </p>
            <p>
                <label>Password (minimum 8 characters)</label><br>
                <input type="password" name="password" minlength="8" required style="width: 100%;">
            </p>
            <button type="submit">Register</button>
        </form>

        <p>Already registered? <a href="/login">Login here</a></p>
        <p><a href="/">Back to Home</a></p>
    </div>
</body>
</html>
